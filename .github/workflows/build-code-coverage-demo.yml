# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-libraries:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run tests
      run: |
        sudo chown -R $USER /usr/local
        cd code-coverage-demo
        ./gradlew :list:test :utilities:test

    - name: Upload test.exec files
      uses: actions/upload-artifact@v4
      with:
        name: test-data-ccd-libraries
        path: |
	  code-coverage-demo/**/build/jacoco/test.exec
	  code-coverage-demo/**/build/reports/jacoco/test/jacocoTestReport.csv
        retention-days: 1
        if-no-files-found: ignore

  test-app:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run tests
      run: |
        sudo chown -R $USER /usr/local
        cd code-coverage-demo
        ./gradlew :app:test

    - name: Upload test.exec files
      uses: actions/upload-artifact@v4
      with:
        name: test-data-ccd-app
        path: |
	  code-coverage-demo/**/build/jacoco/test.exec
	  code-coverage-demo/**/build/reports/jacoco/test/jacocoTestReport.csv
        retention-days: 1
        if-no-files-found: ignore

  code-coverage:
    needs: [ test-app, test-libraries ]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build project
      run: |
        sudo chown -R $USER /usr/local
        cd code-coverage-demo
        ./gradlew classes

    - name: Download test data files
      uses: actions/download-artifact@v4
      with:
        pattern: test-data-ccd-*
        merge-multiple: true
        path: code-coverage-demo

    - name: Generate coverage report
      run: |
        cd code-coverage-demo
        ./gradlew jacocoRootReport

    - name: Upload code coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: code-coverage-demo/build/reports/jacoco/jacocoRootReport
        retention-days: 1
        if-no-files-found: ignore

    - name: Compare the code coverage csv data
      run: |
        cd code-coverage-demo
	./gradlew compareCoverageCsv

